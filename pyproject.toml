# Everything this assignment needs, for uv. On your own computer, run every
# command through uv and it installs exactly these into .venv:
#   uv run pytest tests/test_export.py
# Do not change the versions here. uv.lock holds the exact version of every
# package, and it is the same on Windows, macOS and Linux.
[project]
name = "mas1004-assignment1"
version = "1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "torch>=2.6",
    "torchvision>=0.21",
    "onnx>=1.17",          # writing the model for the web page
    "onnxscript>=0.2",     # writing the model for the web page
    "onnxruntime>=1.20",   # checking the model you wrote
    "pytest>=7.0",
    "requests>=2.31",
    # Other versions of these two crash on macOS or fail to search.
    # src/collect.py refuses to run with anything else.
    "ddgs==9.16.0",
    "primp==1.3.1",
]

[tool.uv]
# Use a Python that uv downloads itself, never one already on the computer.
python-preference = "only-managed"
# PyTorch has no packages for Intel Macs or for Windows on ARM processors.
# On those computers uv stops with an error, and you use Colab instead.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine != 'ARM64'",
    "sys_platform == 'linux'",
]
